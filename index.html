<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <!-- HTML list -->
    <!-- List is used to organize content in a structured way on the webpage. -->
    <!-- We have 3 major types of list -->
     <!-- 1. Ordered list-it's been used when the order of items matter  -->
     <!-- 2. Unordered List -->

<ol>
    <li>Carbohydrate</li>
    <li>Protein</li>
    <li>Fats & oil</li>
    <li>Vitamins</li>
    <li>Mineral Salt</li>
    <li>Water</li>
</ol>

<ul>
    <li>Rice</li>
    <li>Beans</li>
    <li>Cereals</li>
    <li>Spaghetti</li>
    <li>Eggs</li>
    <li>Beverages</li>
</ul>
<dl>
    <dt>HTML</dt>
    <dd>Is described as HyperText Markup Language,it is the back-up of a web page</dd>
</dl>

</body>
</html>
